name: RADYO HAYAL iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Projeyi indir
        uses: actions/checkout@v4

      - name: Flutter kurulumu
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter sürümünü kontrol et
        run: flutter --version

      - name: iOS dosyalarını hazırla
        run: flutter create --platforms=ios .

      - name: Podfile'ı koru
        run: |
          python3 - <<'PY'
          from pathlib import Path

          podfile = Path("ios/Podfile")

          if not podfile.exists():
              raise SystemExit("Podfile bulunamadı")

          text = podfile.read_text()

          text = text.replace(
              "platform :ios, '13.0'",
              "platform :ios, '15.0'"
          )

          podfile.write_text(text)
          PY

      - name: Paketleri yükle
        run: flutter pub get

      - name: CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: iOS uygulamasını derle
        run: flutter build ios --release --no-codesign

      - name: IPA klasörünü hazırla
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r RADYO-HAYAL.ipa Payload

      - name: IPA dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: RADYO-HAYAL-IPA
          path: RADYO-HAYAL.ipa